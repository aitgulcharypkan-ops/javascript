<!DOCTYPE html>
<head>
  <style>
.email{
    color: gray;
    font-family: Arial;
    text-align: center;
    margin-right: 280px; 
}
.email-bar{
    width: 316px;
}
.agree-join{
    color: gray;
    font-family: Arial;
    font-size: 13px;
    text-align: center;
    margin-right: 10px;
}
.agree-button{
    background-color: rgb(75, 75, 251);
    color: white; 
    font-weight: bold;
    width: 330px;
    height: 45px;
    border-radius: 20px;
    border: none;
    text-align: center;
}
.container {
    text-align: center;
}
.poisk-bar{
    width: 350px;
    height: 40px;
    border-radius: 20px;
    border: none; 
    box-shadow: 4px 1px 5px rgba(0, 0, 0, 0.718); 
    padding-left: 25px;
}
.poisk-bar:active{
    border: none; 
}
  </style>  
</head>
<body>
    <p class="email">Email</p>
    <div class="container">
        <input class="email-bar" type="text">
    </div>

    <p class="agree-join">By clicing Agree&Join, you agree to the Privacy Policy</p>
    <div class="container">
        <button class="agree-button">Agree&Join</button>
    </div>
    <input class="poisk-bar" type="text" placeholder="Search Google or type a URL">
    
</body>
