<!DOCTYPE html>
<html>
    <head>
    <title>Support Team</title>
    <style>
        .text-bar{
            width: 220px;
            display: inline-block;
            vertical-align: middle;
        }
        .yes-button
        .no-button{
            display: inline-block;
            vertical-align: middle; 
        }
        .search-bar{
            width: 350px;
            height: 40px;
            border-radius: 20px;
            border: none;
            box-shadow: 3px 1px 5px rgba(0, 0, 0, 0.718); 
            padding-left: 25px;
            display: block;
            margin-top: 10px;
        }
        .search-bar:active{
            border: none;
        }
        .google-img{
            width: 200px; 
            display: block;
            margin-left: 75px;
        }
        .first-name{
            margin-top: 100px;
            border-radius: 4px;
            font-size: 15px;
            width: 100px;
            display: inline-block;
            margin-bottom: 5px;
            height: 25px;
        }
        .last-name{
            margin-top: 100px;
            border-radius: 4px;
            font-size: 15px;
            width: 100px;
            display: inline-block;
            margin-bottom: 5px;
            height: 25px;
        }
        .email-bar{
            border-radius: 4px;
            font-size: 15px;
            width: 212px;
            display: block;
            margin-bottom: 5px;
            height: 25px;
        }
        .sign-button{
            width: 220px;
            background-color: rgb(109, 109, 245);
            color: white;
            font-weight: bold;
            border-radius: 4px;
            border: none;
            height: 35px;
        }
        .request-p{
            font-size: 35px;
            font-family: Arial;
        }
        .enter-bar,
        .pickup-bar{
            display: block;
            margin-bottom: 5px;
            height: 35px;
            width: 350px;
        }
        .request-button{
            height: 40px;
            width: 150px;
            background-color: black;
            color: white;
            border: none;
            margin-top: 10px;
        }
        .later-button{
            height: 40px;
            width: 150px;
            background-color: rgb(228, 223, 223);
            color: black;
            border: none;
            margin-top: 10px;
            margin-left: 15px;
        }
    </style>
    </head>
    <body>
        <p class="text-bar">Thanks for chatting with our cistomer support. Would
            you like to take our quick survey?
         </p>
         <button class="yes-button">Yes</button>
         <button class="no-button">No</button>
           <img class="google-img" src="img/google-logo-png-transparent-background-large-new-1280x433.webp">
            <input class="search-bar" type="text" placeholder="Search Google or type a URL">
         <input class="first-name" type="text" placeholder="First name">
         <input class="last-name" type="text" placeholder="Last name">
         <input class="email-bar" type="text" placeholder="Email">
         <button class="sign-button">Sign up</button>
         <p class="request-p">Request a ride now</p>
         <input class="pickup-bar" type="text" placeholder="Enter pickup location">
         <input class="enter-bar" type="text" placeholder="Enter destination">
         <button class="request-button">Request now</button>
         <button class="later-button">Shcedule for latter</button>
    </body>
</html>
